terms:
  duration: >-
    Subscriptions are valid for 12 months from the date of purchase. Buying another subscription
    before the current one expires rolls unused credits (other than type A) onto the new expiry
    date; letting one lapse forfeits them. Subscriptions are never auto-renewed, and an expiry
    reminder is emailed in the final month.
  payment_methods: [credit card, EFT, BPay]
  payment_detail: >-
    Visa, MasterCard and American Express are accepted; card payments are capped at $30,000 and
    the card must be 3-D Secure compatible or the payment is declined. Card-paid subscriptions
    activate immediately; EFT and BPay subscriptions activate only once payment is received and
    processed.
  refunds: >-
    Overpayments and duplicate payments are held as an account credit and automatically applied
    to the next order unless a refund is requested.
  wash_validity_days: 30
  wash_validity_detail: >-
    A washed list can generally be relied on for 30 days, and washed lists remain downloadable
    for 30 days. This is a legal freshness window, not just a caching hint.
account_types:
- name: Administration account
  detail: >-
    Purchases subscriptions, washes contact lists and creates wash-only accounts. Meets the needs
    of most account holders.
- name: Wash-only account
  detail: >-
    Created by the administrator so additional users can wash lists against the one subscription
    while remaining linked to the one account. Suits large organisations where several
    departments make telemarketing calls or send marketing faxes. Carried on the API as the
    WashOnlyUserId parameter.
