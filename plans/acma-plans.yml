note: >-
  Two very different commercial models sit under one regulator. The ACMA Spectrum Licensing API
  is free and anonymous — there is no plan, no account and no meter. The Do Not Call Register
  washing service is metered in "wash credits" and sold as eight fixed subscription tiers,
  approved by the ACMA under the Do Not Call Register Act 2006. Programmatic access to the
  washing service (RTA/SOAP and AWS/SFTP) requires subscription type D or above; types A, B and
  C are website-only channels.
