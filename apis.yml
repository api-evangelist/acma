name: ACMA
kind: company
description: >-
  The Australian Communications and Media Authority (ACMA) is the Commonwealth
  regulator for telecommunications, radiocommunications, broadcasting and online
  content in Australia. It issues carrier licences and apparatus and spectrum
  licences, maintains the Register of Radiocommunications Licences, administers the
  Australian telephone numbering plan through the Numbering System, operates the Do
  Not Call Register, and polices the Telecommunications Consumer Protections and
  scam-call rules that bind Telstra, Optus, TPG and every other Australian carrier.
  Its API posture is that of a regulator rather than a platform. ACMA runs a real
  Azure API Management developer portal at developer.acma.gov.au and an API gateway
  host at api.acma.gov.au, but both are closed — the portal answers every anonymous
  request with a sign-in wall and the gateway returns 403, so no API, product, or
  OpenAPI definition is visible without an account. The genuinely programmatic
  surface is the Do Not Call Register's list-washing channels, a SOAP Real Time
  Access interface and an SFTP automated washing service, and both sit behind a paid
  industry subscription. Public registers and licence data are published as documents
  and file downloads on data.gov.au rather than as a queryable API. ACMA is a
  regulator, not an operator, so it sits outside the CAMARA and GSMA Open Gateway
  commitment layer entirely; no CAMARA reference was found anywhere in its public
  surface.
