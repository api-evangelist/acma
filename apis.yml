aid: acma
url: https://raw.githubusercontent.com/api-evangelist/acma/refs/heads/main/apis.yml
name: ACMA
kind: company
description: >-
  The Australian Communications and Media Authority (ACMA) is the Commonwealth
  regulator for telecommunications, radiocommunications, broadcasting and online
  content in Australia. It issues carrier licences and apparatus and spectrum
  licences, maintains the Register of Radiocommunications Licences, administers the
  Australian telephone numbering plan through the Numbering System, operates the Do
  Not Call Register, and polices the Telecommunications Consumer Protections and
  scam-call rules that bind Telstra, Optus, TPG and every other Australian carrier.
  Its API posture is that of a regulator: two real programmatic surfaces, both
  attached to a statutory register rather than to a platform. The ACMA Spectrum
  Licensing API is fully public and anonymous — a WCF service at api.acma.gov.au
  exposing 22 REST operations (XML and JSON projections of eleven web methods) plus
  a SOAP endpoint and a live WSDL, letting anyone query licences, licensees,
  transmitter sites, device registrations, antennas, access areas and the 400 MHz
  band register, capped at 2,000 records per query. The Do Not Call Register's
  Real Time Access washing service is a live, publicly-retrievable ColdFusion SOAP
  WSDL whose three operations require a paid industry subscription, alongside an
  SFTP automated washing channel at sftp.donotcall.gov.au. ACMA also runs an Azure
  API Management developer portal at developer.acma.gov.au that is entirely behind
  a sign-in wall. Public register and licence bulk data is published as daily file
  downloads and on data.gov.au rather than as a queryable API. ACMA is a regulator,
  not an operator, so it sits outside the CAMARA and GSMA Open Gateway commitment
  layer entirely; no CAMARA reference was found anywhere in its public surface.
