- aid: acma:do-not-call-register-washing
  name: Do Not Call Register Real Time Access (RTA) Washing Service
  description: >-
    The Do Not Call Register is operated by the ACMA under the Do Not Call Register
    Act 2006. Telemarketers and fax marketers must check ("wash") their contact lists
    against the register before calling. ACMA documents four submission channels for
    washing, two of which are programmatic — "Automated Washing Service (AWS/SFTP)"
    and "Real Time Access (RTA/SOAP)" — alongside manual Quick Wash keying and website
    file upload. The RTA channel is a ColdFusion SOAP web service whose WSDL is
    publicly retrievable at https://www.donotcall.gov.au/dncrtelem/rtw/washing.cfc?wsdl
    and which exposes three operations: GetAccountBalance, WashNumbers and
    GetWashResult. Calling it requires an industry account and a paid washing
    subscription (type D or above); the credentials are an Account/Telemarketer ID
    and passphrase passed in the SOAP body, with an optional wash-only sub-account
    ID. TLS 1.2 or above is mandatory. ACMA recommends up to 200 numbers per call,
    a hard ceiling of 500 numbers per payload, and fewer than 5 million numbers per
    month through this channel. Wash results are returned per number as Y (on the
    register), N (not on the register) or I (invalid phone number). The AWS/SFTP
    channel is a batch alternative at sftp.donotcall.gov.au using SSH key
    authentication with upload/download/archive folders.
  humanURL: https://www.donotcall.gov.au/industry/washing-process-overview/washing-steps
  baseURL: https://www.donotcall.gov.au/dncrtelem/rtw/washing.cfc
