apis:
- aid: acma:spectrum-licensing
  name: ACMA Spectrum Licensing API
  description: >-
    The ACMA Spectrum Licensing API is an application programming interface which
    allows members of the public to query the ACMA's spectrum licensing data —
    the Register of Radiocommunications Licences — so it can be used by external
    developers to build mobile or web applications. It is completely open: no API
    key, no account, no registration and no authentication of any kind. Both a
    REST endpoint (consumable from a browser) and a SOAP endpoint are exposed over
    the same eleven web methods, each published in an XML and a JSON projection,
    for 22 operations in total: licence search, client (licensee) search, site
    search, site-by-location proximity search, device registration search,
    assignment search by postcode/frequency/date range, antenna register search,
    access area lookup, licence category list, licences-in-category list and the
    400 MHz band spectrum licence register search. A single query returns at most
    2,000 records — a deliberate cap to discourage bulk extraction through the API
    — and callers page past it with the offset parameter; the complete dataset is
    published separately as a daily zip download. ACMA documents the service in a
    published guide (Spectrum Licensing API v1.0, 17 June 2016) and serves a live
    WSDL plus XML Schemas from the endpoint itself. Two operations,
    SpectrumLicenceImageSearch and ExtractSpectrumLicensingPDF, are marked
    Deprecated in the guide and are absent from the live WSDL.
