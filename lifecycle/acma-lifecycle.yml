  current: '1.0'
  published: '2016-06-17'
  detail: >-
    ACMA versions the DOCUMENT, not the transport. The published guide is headed "Version: 1.0,
    Published: 17/06/2016" but no version appears in the URL path, in a header, or in any
    response. There is no /v1/ segment and no version negotiation. The service has been running
    on the same endpoint path since at least 2016, which in practice makes it one of the most
    stable public API contracts in Australian government — but the stability is a fact about the
    deployment, not a published commitment.
