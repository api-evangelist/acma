    x-data-licence:
      name: Licence to use the Register of Radiocommunications Licences
      url: https://www.acma.gov.au/radiocomms-licence-data#terms-and-conditions
      attribution_required: 'Based on Australian Communications and Media Authority information'
      prohibited_uses:
      - Unsolicited commercial electronic messages (Spam Act 2003)
      - Unsolicited telemarketing calls (Do Not Call Register Act 2006)
      - Unsolicited mail advertising
      - Reproducing or distributing a natural person's client information in a derivative work
      note: >-
        This is the real access control on an otherwise anonymous API. Any agent or product
        redistributing these records inherits these constraints.
- target: $.info
  update:
    x-agent-warnings:
    - >-
      Results are silently truncated at 2,000 records per query. Always read TOTAL_RESULT and
      page with offset before treating a result set as complete.
    - >-
      An empty result is HTTP 200 with an empty array, not a 404.
    - >-
      Errors are HTML fault pages with no machine-readable body — there is no problem+json,
      no error code and no correlation id.
    - >-
      Frequency units differ by operation: Hz on registration and assignment rows, MHz on the
      400 MHz register.
    - >-
      Request dates on AssignmentRange are DD-MM-YYYY; response dates are ISO local datetimes.
    - >-
      Identifier types are inconsistent — CLIENT_NO is a JSON number on some operations and a
      string on others. Treat all identifiers as strings.
    - >-
      The register records LICENCES, not transmissions. Absence from the register is not proof
      a band is clear; class-licensed and defence spectrum are not in this dataset.
