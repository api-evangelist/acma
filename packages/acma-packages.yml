official_sdks: 0
official_note: >-
  ACMA publishes NO client libraries in any language and operates no GitHub organisation. This is
  a genuine gap rather than an unfound one: the Spectrum Licensing API is a WCF service whose WSDL
  is live and public, so any .NET, Java or Python SOAP toolchain can generate a client from
  api.acma.gov.au/SpectrumLicensingAPIOuterService/OuterService.svc?wsdl in one command — which is
  presumably why ACMA never hand-wrote one. For the REST projection there is nothing to install;
  the operations are plain GETs with no auth.
