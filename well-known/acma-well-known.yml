gap:
  security_txt: >-
    ACMA runs a genuine vulnerability disclosure programme with a published policy and a
    dedicated mailbox (responsible.disclosure@acma.gov.au) but does not advertise it in an
    RFC 9116 security.txt on any host. A one-line security.txt pointing at
    https://www.acma.gov.au/vulnerability-disclosure-policy would make the existing programme
    machine-discoverable at zero cost. See security/acma-vulnerability-disclosure.yml.
