summary: >-
  ACMA publishes NOTHING at /.well-known/ on any of its hosts. No security.txt (despite
  operating a real vulnerability disclosure policy at a normal web page), no OIDC discovery, no
  RFC 8414 authorization-server metadata, no api-catalog, no ai-plugin. The two HTTP 200s
  recorded below are false positives and are marked as such: developer.acma.gov.au is an Azure
  API Management developer portal whose single-page-app catch-all returns the same 4,658-byte
  text/html sign-in shell for every unmatched path, including well-known paths. Nothing was
  saved to disk because nothing real was returned.
