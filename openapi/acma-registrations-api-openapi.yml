      - Registrations
      parameters:
      - name: strLowerPostCode
        in: query
        required: false
        description: The lower post code in the post code range.
        schema:
          type: string
      - name: strUpperPostCode
        in: query
        required: false
        description: The upper post code in the post code range.
        schema:
          type: string
      - name: strLowerFreq
        in: query
        required: false
        description: The lower frequency in the frequency range.
        schema:
          type: string
      - name: strUpperFreq
        in: query
        required: false
        description: The upper frequency in the frequency range.
        schema:
          type: string
      - name: strLowerDate
        in: query
        required: false
        description: The lower date in the date range, formatted DD-MM-YYYY.
        schema:
          type: string
          examples:
          - 01-01-2010
      - name: strUpperDate
        in: query
        required: false
        description: The upper date in the date range, formatted DD-MM-YYYY.
        schema:
          type: string
          examples:
          - 01-01-2016
      - $ref: '#/components/parameters/strOffset'
      - $ref: '#/components/parameters/strLimit'
      - name: sortBy
        in: query
        required: false
        description: The field to sort the results by.
        schema:
          type: string
          enum:
          - id
          - frequency
          - emission_desg
          - date
          - rownum
      responses:
        '200':
          description: Matching records. The service returns HTTP 200 with an empty result array when nothing matches.
