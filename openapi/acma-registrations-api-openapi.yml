components:
  schemas:
    AssignmentRangeResponse:
      type: object
      title: AssignmentRangeResponse
      description: Frequency assignment range results.
      properties:
        Assignment:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    Registration:
      type: object
      title: Registration
      description: A device registration / frequency assignment record.
      properties:
        TOTAL_RESULT:
          type:
          - number
          - 'null'
        RESULTS_INDEX:
          type:
          - number
          - 'null'
        ID_SORT_FIELD:
          type:
          - string
          - 'null'
        DEVICE_REGISTRATION_IDENTIFIER:
          type:
          - string
          - 'null'
        EFL_ID:
          type:
          - integer
          - 'null'
        EMISSION_DESIG:
          type:
          - string
          - 'null'
        FREQ:
          type:
          - number
          - 'null'
        LICENCE_NO:
          type:
          - string
          - 'null'
        CLIENT_NO:
          type:
          - string
          - 'null'
        SITE_ID:
          type:
          - number
          - 'null'
        DEVICE_TYPE_TEXT:
          type:
          - string
          - 'null'
        FORMER_DEVICE_IDENTIFIER:
          type:
          - string
          - 'null'
    Assignment:
      type: object
      title: Assignment
      description: A frequency assignment record within a postcode, frequency and date range.
      properties:
        TOTAL_RESULT:
          type:
          - number
          - 'null'
        RESULTS_INDEX:
          type:
          - number
          - 'null'
        ID_SORT_FIELD:
          type:
          - string
          - 'null'
        DEVICE_REGISTRATION_IDENTIFIER:
          type:
          - string
          - 'null'
        EFL_ID:
          type:
          - string
          - 'null'
        EMISSION_DESIG:
          type:
          - string
          - 'null'
        FREQ:
          type:
          - number
          - 'null'
        LICENCE_NO:
          type:
          - string
          - 'null'
        CLIENT_NO:
          type:
          - string
          - 'null'
        BANDWIDTH:
          type:
          - number
          - 'null'
        OP_MODE:
          type:
          - string
          - 'null'
        SITE_ID:
          type:
          - string
          - 'null'
        AREA_ID:
          type:
          - string
          - 'null'
        AUTHORISATION_DATE:
          type:
          - string
          - 'null'
    RegistrationSearchResponse:
      type: object
      title: RegistrationSearchResponse
      description: Device registration search results.
      properties:
        Registration:
          type: array
          items:
            $ref: '#/components/schemas/Registration'
  parameters:
    searchTextQuery:
      name: searchText
      in: query
      required: true
      description: 'The text to search for. Mandatory, and must always be supplied on the query string (documented exception in the ACMA guide: it is passed as a query parameter rather than a path segment so it may itself contain ''/'', which appears in many licence numbers).'
      schema:
        type: string
    searchOption:
      name: searchOption
      in: query
      required: false
      description: 'How searchText is matched: matches, begins with, or sounds like.'
      schema:
        type: string
        enum:
        - matches
        - begins with
        - sounds like
    isJSONP:
      name: isJSONP
      in: query
      required: false
      description: true or false, depending on whether JSONP is used.
      schema:
        type: boolean
    strOffset:
      name: strOffset
      in: query
      required: false
      description: The number of records to skip over.
      schema:
        type: integer
        minimum: 0
    jsonpCallback:
      name: jsonpCallback
      in: query
      required: false
      description: The callback function name to wrap the response in for JSONP.
      schema:
        type: string
    resultsLimit:
      name: resultsLimit
      in: query
      required: false
      description: The number of records to return after the offset. The service caps any single query at 2,000 records.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
    offset:
      name: offset
      in: query
      required: false
      description: The number of records to skip over. Used with resultsLimit to page beyond the 2,000-record cap (0, 2000, 4000, ...).
      schema:
        type: integer
        minimum: 0
    strLimit:
      name: strLimit
      in: query
      required: false
      description: The number of records to return after the offset. The service caps any single query at 2,000 records.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
