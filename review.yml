actions:
  apisYmlUpdated: true
  openapiHarvested: false
  specsCount: 0
  reason: |
    Bootstrapped as identity plus one honest API entry. ACMA's only documented
    programmatic surface is the Do Not Call Register's RTA/SOAP and AWS/SFTP washing
    channels, which are named in public documentation but reachable only with a paid
    industry subscription. The developer portal is real infrastructure behind a
    complete login wall. No machine-readable specification of any kind is published,
    so no openapi/ directory exists in this repo.
